version: '3'

services:

  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: always

    ports:
      - "18080:80"

    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: pavan
      WORDPRESS_DB_PASSWORD: mypass@123
      WORDPRESS_DB_NAME: wp

    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: mysql
    restart: always

    environment:
      MYSQL_DATABASE: wp
      MYSQL_USER: pavan
      MYSQL_PASSWORD: mypass@123
      MYSQL_ROOT_PASSWORD: rootpass

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
